# lck-manager.kro.kr — LCK 매니저 (정적 파일, 별도 포트·백엔드 없음). /etc/nginx/sites-available/lck-manager 로 둔다.
#
# dfutils가 80번의 default_server다. 여기에는 default_server를 붙이지 않는다.
# DNS를 등록하기 전에 이 파일을 먼저 켜 두어야 첫 접속이 dfutils로 301되어 브라우저에 남지 않는다.
# 처음에는 80 블록만 둔다. 임시 자체서명 인증서는 쓰지 않는다.
# 인증서를 받으면 lck-manager-cert-retry.sh가 certbot --nginx --redirect --hsts로 443 블록과 이동을 넣는다.

server {
    listen 80;
    listen [::]:80;
    server_name lck-manager.kro.kr;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    root /var/www/lck-manager;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # 빌드 파일 이름에 해시가 붙어 있어 오래 캐시해도 된다
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Robots-Tag "noindex" always;
    }
    # 선수·챔피언 데이터는 다시 올릴 수 있으니 짧게
    location /data/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Robots-Tag "noindex" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Robots-Tag "noindex" always;
    }

    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/lck-manager.access.log;
    error_log  /var/log/nginx/lck-manager.error.log;
}
